<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로필 - NewsHub</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

    <div class="title-row">
        <h1>내 프로필</h1>

        <a href="{{ url_for('profile') }}" class="profile-icon" aria-label="프로필">
            👤
        </a>
    </div>

    <main>

        <article class="profile-summary">

            <div class="profile-avatar" aria-hidden="true">👤</div>

            <h2>{{ username }}</h2>

            <p>
                NewsHub 회원
            </p>

        </article>

        <article>

            <h3>📊 이용 현황</h3>

            <p>
                🔍 총 검색 횟수 :
                <strong>{{ search_count }}회</strong>
            </p>

            <p>
                ⭐ 즐겨찾기 :
                <strong>{{ favorite_count }}개</strong>
            </p>

            <p>
                🔥 가장 많이 검색한 키워드 :
                <strong>{{ top_keyword }}</strong>
            </p>

        </article>

        <article>

            <h3>🔒 내 검색 기록</h3>

            <p>
                검색 기록은 추천뉴스의 관심 키워드 분석에만 사용됩니다.
                삭제하면 관심 키워드와 추천이 초기화됩니다.
            </p>

            <form
                method="POST"
                action="{{ url_for('delete_search_history') }}"
                onsubmit="return confirm('내 검색 기록을 모두 삭제할까요?');"
            >
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <button type="submit" class="delete-button">
                    검색 기록 삭제
                </button>
            </form>

        </article>

        <article class="profile-actions">

            <form method="POST" action="{{ url_for('logout') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <button type="submit" class="delete-button">
                    로그아웃
                </button>
            </form>

        </article>

    </main>

    <footer>
        <a href="{{ url_for('home') }}">홈</a>
        <a href="{{ url_for('favorites') }}">즐겨찾기</a>
        <a href="{{ url_for('interests') }}">추천뉴스</a>
    </footer>

</body>
</html>
