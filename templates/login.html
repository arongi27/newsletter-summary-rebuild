<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - NewsHub</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

<div class="login-container">

    <div class="login-card">

        <h1>로그인</h1>

        <p class="login-subtitle">
            로그인하여 맞춤형 뉴스를 만나보세요.
        </p>

        <form
            method="POST"
            action="{{ url_for('login') }}"
            autocomplete="off"
        >

            <input
                type="text"
                name="username"
                placeholder="아이디"
                autocomplete="username"
                spellcheck="false"
                autocapitalize="off"
                autocorrect="off"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="비밀번호"
                autocomplete="current-password"
                required
            >

            <button
                type="submit"
                class="login-button"
            >
                로그인
            </button>

        </form>

        <div class="login-links">

            <a href="{{ url_for('signup') }}">
                회원가입
            </a>

            <a href="{{ url_for('home') }}">
                홈으로
            </a>

        </div>

    </div>

</div>

</body>
</html>
